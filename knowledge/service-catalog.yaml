catalog_version: 0.1.0
status: draft

services:
  - service_id: payment-api
    service_display_name: Payment Orchestration Service
    criticality: high

    environments:
      - environment_id: production
        deployment_targets:
          - deployment_target_id: payment-api-prod-eu-central-1
            region_id: eu-central-1
            cluster_id: prod-payments-01
            namespace_id: payments

      - environment_id: staging
        deployment_targets:
          - deployment_target_id: payment-api-staging-eu-central-1
            region_id: eu-central-1
            cluster_id: staging-payments-01
            namespace_id: payments

    telemetry_sources:
      - metrics-store
      - deployment-store
      - runtime-events-store
      - dependency-state-store
      - traffic-store
