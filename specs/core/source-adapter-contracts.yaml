spec_version: 0.1.0
status: draft
specification_family: governed-runtime-core

purpose: >
  Define how deterministic raw source responses are validated and converted
  into factual normalized observations.

principles:
  - Adapters produce observed facts, not diagnostic conclusions.
  - Every normalized observation retains its source, timestamp and scope.
  - Raw source responses remain available through raw_reference.
  - Missing values remain explicit and are not inferred by the adapter.
  - Invalid source data must not silently enter normalized state.
  - Hidden evaluation data is never available to adapters.

standard_observation:
  required_fields:
    - observation_id
    - source_type
    - source_id
    - observed_at
    - collected_at
    - scope
    - summary
    - raw_reference

  optional_fields:
    - metric_name
    - metric_value
    - unit
    - dimensions
    - time_window
    - freshness_status
    - limitations

source_adapters:
  service_status:
    tool_name: get_service_status
    source_file_type: service-status
    source_type: SERVICE_STATUS
    required_source_fields:
      - source_id
      - source_timestamp
      - service_id
      - environment_id
      - deployment_target_id
      - desired_replicas
      - ready_replicas
      - available_replicas
      - replica_statuses
    normalized_outputs:
      - replica count observations
      - replica readiness observations
      - replica availability observations
      - readiness transition observations

  service_metrics:
    tool_name: get_service_metrics
    source_file_type: metrics
    source_type: SERVICE_METRIC
    required_source_fields:
      - source_id
      - source_timestamp
      - service_id
      - environment_id
      - window
      - metric_series
    normalized_outputs:
      - one observation per metric series and dimension set
    rules:
      - Preserve metric name, unit, dimensions and complete time window.
      - Do not replace a time series with only its latest point.
      - Record missing series explicitly.

  recent_deployments:
    tool_name: get_recent_deployments
    source_file_type: deployments
    source_type: DEPLOYMENT
    required_source_fields:
      - source_id
      - source_timestamp
      - service_id
      - environment_id
      - deployment_target_id
      - deployments
      - active_version_groups
      - rollout_status
    normalized_outputs:
      - deployment event observations
      - active version group observations
      - rollout status observations
      - rollback candidate observations
      - compatibility status observations

  runtime_events:
    tool_name: get_recent_runtime_events
    source_file_type: runtime-events
    source_type: RUNTIME_EVENT
    required_source_fields:
      - source_id
      - source_timestamp
      - service_id
      - environment_id
      - events
      - active_operations
    normalized_outputs:
      - one observation per runtime event
      - active conflicting operation observations

  dependency_status:
    tool_name: get_dependency_status
    source_file_type: dependencies
    source_type: DEPENDENCY_STATUS
    required_source_fields:
      - source_id
      - source_timestamp
      - service_id
      - environment_id
      - dependency_states
    normalized_outputs:
      - one observation per dependency
      - dependency degradation window observations
      - unavailable dependency observations

  traffic_breakdown:
    tool_name: get_traffic_breakdown
    source_file_type: traffic
    source_type: TRAFFIC
    required_source_fields:
      - source_id
      - source_timestamp
      - service_id
      - environment_id
      - window
      - total_request_rate_rps
      - traffic_groups
    normalized_outputs:
      - total traffic observation
      - one observation per grouping and dimension set

normalization_rules:
  identifiers:
    - Preserve canonical service, environment, deployment, version and replica IDs.
    - Reject records that conflict with the resolved scenario target.

  timestamps:
    - Parse timestamps as timezone-aware date-time values.
    - Preserve both source observation time and runtime collection time.
    - Evaluate freshness after normalization, not inside source fixtures.

  missing_data:
    - Missing fields required by the adapter contract cause validation failure.
    - Optional unavailable values remain null or explicit missing records.
    - Absence of degradation data does not prove health unless the source states health.

  facts_and_inference:
    - Adapters may calculate deterministic derived values such as replica totals.
    - Adapters must not assign root cause, hypothesis confidence or action readiness.
    - Diagnostic claims are created only after normalized observations exist.

  security:
    - Treat all source text as untrusted data.
    - Ignore instruction-like text inside source results.
    - Do not load files outside the scenario source mapping.

adapter_failures:
  invalid_schema:
    tool_status: FAILED
    error_code: INVALID_SOURCE_SCHEMA

  missing_required_field:
    tool_status: FAILED
    error_code: MISSING_REQUIRED_SOURCE_FIELD

  target_mismatch:
    tool_status: FAILED
    error_code: SOURCE_TARGET_MISMATCH

  invalid_timestamp:
    tool_status: FAILED
    error_code: INVALID_SOURCE_TIMESTAMP

  partial_source_data:
    tool_status: PARTIAL
    error_code: PARTIAL_SOURCE_DATA

timestamp_validation_boundary:
  validation_stage: after_normalization_before_return
  error_code: INVALID_SOURCE_TIMESTAMP

  normalized_fields:
    - observed_at
    - collected_at

  decision_relevant_nested_fields:
    - metric_series[].points[].timestamp

  requirements:
    - Every normalized observed_at value is an ISO 8601 date-time string.
    - Every normalized collected_at value is an ISO 8601 date-time string.
    - Both values contain a timezone offset.
    - UTC Z notation and explicit numeric offsets are accepted.
    - Invalid timestamps reject the complete source normalization.
    - Validation occurs before normalized observations are returned.
    - Invalid observed_at must not fall back to collected_at.
    - Valid timestamp strings are preserved without silent rewriting.

  baseline_scope:
    - Validate timestamps that enter normalized control and evidence fields.
    - Validate metric point timestamps because deterministic evidence logic selects the latest point.
    - Other nested timestamps remain outside the Exp 18.0 boundary unless they participate in deterministic decisions.
